name: Build, Scan & Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: lokeshzenbook/node-app09

jobs:
  build-and-scan:
    name: Build, Scan & Push
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build application
      - name: Build application
        run: npm run build

      # 5. Scan source code for secrets
      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3

      # 6. Scan filesystem dependencies
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # 7. Set Docker image tag
      - name: Set image tag
        id: meta
        run: |
          echo "image-tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # 8. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }} \
            -t ${{ env.IMAGE_NAME }}:latest .

      # 9. Scan Docker image
      - name: Run Trivy Docker image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # 10. Login to Docker Hub
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 11. Push Docker image to Docker Hub
      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }}
          docker push ${{ env.IMAGE_NAME }}:latest
