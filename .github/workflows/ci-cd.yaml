name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "scan-only"
        type: choice
        options:
          - scan-only
          - deploy

permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: lokeshzenbook/node-app09

jobs:
  build-and-scan:
    name: Build and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2.2.2

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          output: trivy-report.txt

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

  deploy:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'deploy')

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker images
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker build -t $IMAGE_NAME:latest .
          docker build -t $IMAGE_NAME:$IMAGE_TAG .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          output: trivy-image-report.txt

      - name: Push Docker images
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$IMAGE_TAG

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [build-and-scan, deploy]
    if: always()

    steps:
      - name: Download Trivy report
        uses: actions/download-artifact@v4
        with:
          name: trivy-report
          path: reports/
        continue-on-error: true

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          to: lokeshnaidu6868@gmail.com
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          subject: "DevSecOps Pipeline: ${{ needs.build-and-scan.result }} - ${{ github.repository }} #${{ github.run_number }}"
          body: |
            Pipeline Status: ${{ job.status }}

            Repository: ${{ github.repository }}
            Branch    : ${{ github.ref_name }}
            Commit    : ${{ github.sha }}
            Actor     : ${{ github.actor }}
            Run       : #${{ github.run_number }}

            Job Results:
            - Build & Scan : ${{ needs.build-and-scan.result }}
            - Deploy       : ${{ needs.deploy.result }}

            Docker Hub image: ${{ env.IMAGE_NAME }}:latest

            Trivy filesystem scan report attached.

            View run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: reports/trivy-report.txt
        continue-on-error: true

      - name: Send Slack notification
        if: always()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "DevSecOps Pipeline: ${{ job.status }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Repo:*\n${{ github.repository }}" },
                    { "type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}" },
                    { "type": "mrkdwn", "text": "*Actor:*\n${{ github.actor }}" },
                    { "type": "mrkdwn", "text": "*Build & Scan:*\n${{ needs.build-and-scan.result }}" },
                    { "type": "mrkdwn", "text": "*Deploy:*\n${{ needs.deploy.result }}" },
                    { "type": "mrkdwn", "text": "*Image:*\n${{ env.IMAGE_NAME }}:latest" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true
