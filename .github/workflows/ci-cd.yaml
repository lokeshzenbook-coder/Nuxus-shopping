name: Production CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Pipeline mode"
        required: true
        default: "scan-only"
        type: choice
        options:
          - scan-only
          - deploy
      tag:
        description: "Image tag to deploy (blank = latest commit SHA)"
        required: false
        default: ""

# ── Required secrets ──
# DOCKERHUB_USERNAME, DOCKERHUB_PASSWORD  — Docker Hub login
# AWS_ROLE_ARN                            — IAM role for GitHub OIDC → EKS
# EKS_CLUSTER_NAME                        — EKS cluster name
# EMAIL_USERNAME, EMAIL_PASSWORD          — Gmail SMTP (notifications)
# SLACK_WEBHOOK_URL                       — Slack incoming webhook

permissions:
  contents: read
  security-events: write
  id-token: write

env:
  IMAGE_NAME: lokeshzenbook/node-app09
  AWS_REGION: us-east-1

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB 1 — Build, Test & Security Scans
  # ────────────────────────────────────────────────────────────
  build-and-scan:
    name: Build, Test & Security Scan
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Type-check & test
        run: npm test

      - name: Build application
        run: npm run build

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2.2.2

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          output: trivy-fs-report.txt

      - name: Set image tag
        id: meta
        run: echo "image-tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }} .
          docker build -t ${{ env.IMAGE_NAME }}:latest .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          output: trivy-image-report.txt

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Docker images
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy-fs-report.txt
            trivy-image-report.txt
          retention-days: 14

  # ────────────────────────────────────────────────────────────
  # JOB 2 — Deploy to Staging (auto on main push)
  # ────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Add "environment: staging" here to enable GitHub Environment protection rules

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Set image in kustomize (staging)
        working-directory: kubernetes/staging
        run: kustomize edit set image ${{ env.IMAGE_NAME }}=${{ env.IMAGE_NAME }}:${{ needs.build-and-scan.outputs.image-tag }}

      - name: Apply Kubernetes manifests
        run: kubectl apply -k kubernetes/staging/

      - name: Wait for rollout
        run: kubectl rollout status deployment/nexus-market -n nexus-market-staging --timeout=300s

      - name: Print staging info
        run: |
          echo "::notice::Staging deployed — image ${{ env.IMAGE_NAME }}:${{ needs.build-and-scan.outputs.image-tag }}"
          kubectl get pods -n nexus-market-staging -l app.kubernetes.io/name=nexus-market

  # ────────────────────────────────────────────────────────────
  # JOB 3 — Deploy to Production (manual dispatch only)
  # ────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'deploy'
    # Add "environment: production" here to enable GitHub Environment protection rules
    # (requires manual approval in repo Settings → Environments → production)

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: resolve
        run: |
          TAG="${{ github.event.inputs.tag }}"
          TAG="${TAG:-${{ needs.build-and-scan.outputs.image-tag }}}"
          echo "image-tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: $TAG"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ secrets.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Set image in kustomize (production)
        working-directory: kubernetes/production
        run: kustomize edit set image ${{ env.IMAGE_NAME }}=${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.image-tag }}

      - name: Apply Kubernetes manifests
        run: kubectl apply -k kubernetes/production/

      - name: Wait for rollout
        run: kubectl rollout status deployment/nexus-market -n nexus-market-production --timeout=300s

      - name: Print production info
        run: |
          echo "::notice::Production deployed — image ${{ env.IMAGE_NAME }}:${{ steps.resolve.outputs.image-tag }}"
          kubectl get pods -n nexus-market-production -l app.kubernetes.io/name=nexus-market

  # ────────────────────────────────────────────────────────────
  # JOB 4 — Notifications (always runs)
  # ────────────────────────────────────────────────────────────
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [build-and-scan, deploy-staging, deploy-production]
    if: always()

    steps:
      - name: Download security reports
        uses: actions/download-artifact@v4
        with:
          name: security-reports
          path: reports/
        continue-on-error: true

      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          to: lokeshnaidu6868@gmail.com
          from: GitHub Actions <${{ secrets.EMAIL_USERNAME }}>
          subject: "CI/CD ${{ github.repository }} #${{ github.run_number }} — ${{ needs.build-and-scan.result }}"
          body: |
            Pipeline  : ${{ github.workflow }}
            Repository: ${{ github.repository }}
            Branch    : ${{ github.ref_name }}
            Commit    : ${{ github.sha }}
            Actor     : ${{ github.actor }}
            Run       : #${{ github.run_number }}

            ── Job Results ──
            Build & Scan  : ${{ needs.build-and-scan.result }}
            Deploy Staging: ${{ needs.deploy-staging.result }}
            Deploy Prod   : ${{ needs.deploy-production.result }}

            Image  : ${{ env.IMAGE_NAME }}:${{ needs.build-and-scan.outputs.image-tag }}
            Docker : https://hub.docker.com/r/${{ env.IMAGE_NAME }}

            Security reports attached.

            View run:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: reports/trivy-fs-report.txt,reports/trivy-image-report.txt
        continue-on-error: true

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "CI/CD Pipeline"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*Repo:*\n${{ github.repository }}" },
                    { "type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}" },
                    { "type": "mrkdwn", "text": "*Actor:*\n${{ github.actor }}" },
                    { "type": "mrkdwn", "text": "*Image:*\n`${{ env.IMAGE_NAME }}:${{ needs.build-and-scan.outputs.image-tag }}`" },
                    { "type": "mrkdwn", "text": "*Build & Scan:*\n${{ needs.build-and-scan.result }}" },
                    { "type": "mrkdwn", "text": "*Staging:*\n${{ needs.deploy-staging.result }}" },
                    { "type": "mrkdwn", "text": "*Production:*\n${{ needs.deploy-production.result }}" }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": { "type": "plain_text", "text": "View run" },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        continue-on-error: true
