name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: lokeshzenbook/node-app66

jobs:
  # ==================================================
  # LINT JOB
  # ==================================================
  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ==================================================
  # UNIT TEST JOB
  # ==================================================
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Generate Test Coverage
        run: npm run test:coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # ==================================================
  # BUILD & DEPLOY JOB
  # ==================================================
  build-deploy:
    name: Build, Scan & Deploy
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      # ---------- Checkout ----------
      - name: Checkout source
        uses: actions/checkout@v4

      # ---------- Setup Node.js ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # ---------- Install Dependencies ----------
      - name: Install dependencies
        run: npm ci

      # ---------- Build Application ----------
      - name: Build application
        run: npm run build

      # ---------- Install Trivy ----------
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -

          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      # ---------- Trivy Filesystem Scan ----------
      - name: Run Trivy FS Scan
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            . > trivy-report.txt

      # ---------- Upload Trivy Report ----------
      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

      # ---------- Docker Hub Login ----------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------- Build Docker Images ----------
      - name: Build Docker Images
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}

          docker build -t $IMAGE_NAME:latest .
          docker build -t $IMAGE_NAME:$IMAGE_TAG .

      # ---------- Trivy Docker Image Scan ----------
      - name: Scan Docker Image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}

          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            $IMAGE_NAME:$IMAGE_TAG

      # ---------- Push Docker Hub Images ----------
      - name: Push Docker Hub Images
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}

          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$IMAGE_TAG

      # # ---------- Configure AWS Credentials ----------
      # - name: Configure AWS Credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::590184029746:role/github-actions-oidc-role
      #     aws-region: ${{ env.AWS_REGION }}

      # # ---------- Verify AWS Identity ----------
      # - name: Verify AWS Identity
      #   run: aws sts get-caller-identity

      # # ---------- Login to Amazon ECR ----------
      # - name: Login to Amazon ECR
      #   id: login-ecr
      #   uses: aws-actions/amazon-ecr-login@v2

      # # ---------- Create ECR Repository ----------
      # - name: Create ECR Repository if Missing
      #   run: |
      #     aws ecr describe-repositories \
      #       --repository-names $ECR_REPOSITORY \
      #     || aws ecr create-repository \
      #       --repository-name $ECR_REPOSITORY

      # # ---------- Tag Docker Images ----------
      # - name: Tag Docker Images
      #   run: |
      #     IMAGE_TAG=${GITHUB_SHA::7}
      #     ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}

      #     docker tag $IMAGE_NAME:latest \
      #       $ECR_REGISTRY/$ECR_REPOSITORY:latest

      #     docker tag $IMAGE_NAME:$IMAGE_TAG \
      #       $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # # ---------- Push Docker Images to ECR ----------
      # - name: Push Docker Images to ECR
      #   run: |
      #     IMAGE_TAG=${GITHUB_SHA::7}
      #     ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}

      #     docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
      #     docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # ---------- Email Notification ----------
      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: "Node.js CI/CD Pipeline Status 🚀"

          body: |
            Pipeline Status: ${{ job.status }}

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}

            Quality Gates Passed:
            ✓ ESLint
            ✓ Unit Tests
            ✓ Build
            ✓ Trivy Security Scan

            Docker Hub:
            - $IMAGE_NAME:latest

            # Amazon ECR:
            # - ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

          to: your-email@gmail.com
          from: GitHub Actions

          attachments: trivy-report.txt
