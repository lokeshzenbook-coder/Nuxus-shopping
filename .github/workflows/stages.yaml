name: Node.js DevSecOps Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: lokeshzenbook/node-app6
  AWS_REGION: us-east-1
  ECR_REPOSITORY: node-app

jobs:

  # =====================================================
  # BUILD + TEST + SECURITY SCAN
  # =====================================================

  build-test-scan:
    name: Build Test Scan
    runs-on: ubuntu-latest

    steps:
      # ---------- Checkout ----------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------- Setup Node.js ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ---------- Install Dependencies ----------
      - name: Install Dependencies
        run: npm install

      # ---------- Run Tests ----------
      - name: Run Tests
        run: npm test

      # ---------- Build Application ----------
      - name: Build Application
        run: npm run build

      # ---------- Install Trivy ----------
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
          | sudo apt-key add -

          echo "deb https://aquasecurity.github.io/trivy-repo/deb \
          $(lsb_release -sc) main" \
          | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      # ---------- Trivy Scan ----------
      - name: Run Trivy Scan
        run: |
          trivy fs . \
          --severity HIGH,CRITICAL \
          --output trivy-report.txt

      # ---------- Upload Trivy Report ----------
      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

  # =====================================================
  # DOCKER BUILD + PUSH
  # =====================================================

  docker-build-push:
    name: Docker Build Push
    runs-on: ubuntu-latest
    needs: build-test-scan

    steps:
      # ---------- Checkout ----------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------- Configure AWS Credentials ----------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::590184029746:role/github-actions-oidc-role
          aws-region: ${{ env.AWS_REGION }}

      # ---------- Login to Docker Hub ----------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------- Login to Amazon ECR ----------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---------- Create ECR Repository ----------
      - name: Create ECR Repository if Not Exists
        run: |
          aws ecr describe-repositories \
          --repository-names $ECR_REPOSITORY \
          || aws ecr create-repository \
          --repository-name $ECR_REPOSITORY

      # ---------- Build Docker Image ----------
      - name: Build Docker Image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}

          docker build -t $IMAGE_NAME:latest .
          docker build -t $IMAGE_NAME:$IMAGE_TAG .

      # ---------- Push Docker Hub Images ----------
      - name: Push Docker Hub Images
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}

          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$IMAGE_TAG

      # ---------- Tag Docker Images for ECR ----------
      - name: Tag Docker Images
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}

          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}

          docker tag $IMAGE_NAME:latest \
          $ECR_REGISTRY/$ECR_REPOSITORY:latest

          docker tag $IMAGE_NAME:$IMAGE_TAG \
          $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # ---------- Push Docker Images to ECR ----------
      - name: Push Docker Images to ECR
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}

          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # =====================================================
  # EMAIL NOTIFICATION
  # =====================================================

  notifications:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: always()

    steps:
      # ---------- Download Trivy Report ----------
      - name: Download Trivy Report
        uses: actions/download-artifact@v4
        with:
          name: trivy-report

      # ---------- Send Email ----------
      - name: Send Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: "Node.js DevSecOps Pipeline 🚀"

          body: |
            Pipeline Status: ${{ job.status }}

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}

            Docker Image:
            - $IMAGE_NAME:latest

            Amazon ECR Repository:
            - ${{ env.ECR_REPOSITORY }}

            Trivy security scan completed successfully.

          to: your-email@gmail.com
          from: GitHub Actions

          attachments: trivy-report.txt
