name: Node.js CI/CD Pipeline

on:
push:
branches:
- main

pull_request:
branches:
- main

permissions:
contents: read
security-events: write

env:
IMAGE_NAME: lokeshzenbook/node-app66

jobs:

security-scan:
name: Secrets, SAST & Dockerfile Scan
runs-on: ubuntu-latest

```
steps:
  - name: Checkout Source
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  ########################################
  # TRUFFLEHOG
  ########################################

  - name: TruffleHog Secret Scan
    uses: trufflesecurity/trufflehog@main
    with:
      path: ./
      extra_args: --only-verified

  ########################################
  # SEMGREP
  ########################################

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install Semgrep
    run: |
      python -m pip install --upgrade pip
      pip install semgrep

  - name: Run Semgrep Scan
    run: |
      semgrep scan \
        --config=auto \
        --sarif \
        --output semgrep.sarif

  - name: Upload Semgrep Report
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: semgrep-report
      path: semgrep.sarif
      if-no-files-found: ignore

  ########################################
  # HADOLINT
  ########################################

  - name: Hadolint Dockerfile Scan
    uses: hadolint/hadolint-action@v3.1.0
    with:
      dockerfile: Dockerfile
```

lint:
name: Lint Check
runs-on: ubuntu-latest
needs: security-scan

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 18
      cache: npm

  - run: npm ci

  - name: Run ESLint
    run: npm run lint --if-present
```

unit-test:
name: Unit Tests
runs-on: ubuntu-latest
needs: lint

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 18
      cache: npm

  - run: npm ci

  - name: Run Tests
    run: npm test --if-present

  - name: Run Unit Tests
    run: npm run test:unit --if-present

  - name: Coverage
    run: npm run test:coverage --if-present

  - name: Upload Coverage Report
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: coverage-report
      path: coverage/
      if-no-files-found: ignore
```

build-deploy:
name: Build Scan and Push
runs-on: ubuntu-latest
needs: unit-test

```
steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-node@v4
    with:
      node-version: 18
      cache: npm

  - run: npm ci

  - name: Build Application
    run: npm run build --if-present

  ########################################
  # TRIVY INSTALL
  ########################################

  - name: Install Trivy
    run: |
      sudo apt-get update
      sudo apt-get install -y wget
      wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
      | sudo sh -s -- -b /usr/local/bin

  ########################################
  # FILESYSTEM SCAN
  ########################################

  - name: Trivy Filesystem Scan
    run: |
      trivy fs . \
      --severity HIGH,CRITICAL \
      --format table \
      --output trivy-fs-report.txt

  - name: Upload Trivy FS Report
    uses: actions/upload-artifact@v4
    with:
      name: trivy-fs-report
      path: trivy-fs-report.txt

  ########################################
  # DOCKER LOGIN
  ########################################

  - name: Login to Docker Hub
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKER_USERNAME }}
      password: ${{ secrets.DOCKER_PASSWORD }}

  ########################################
  # DOCKER BUILD
  ########################################

  - name: Build Docker Image
    run: |
      IMAGE_TAG=${GITHUB_SHA::7}

      docker build \
        -t $IMAGE_NAME:latest \
        -t $IMAGE_NAME:$IMAGE_TAG .

  ########################################
  # IMAGE SCAN
  ########################################

  - name: Trivy Image Scan
    run: |
      IMAGE_TAG=${GITHUB_SHA::7}

      trivy image \
        --severity HIGH,CRITICAL \
        --exit-code 0 \
        $IMAGE_NAME:$IMAGE_TAG

  ########################################
  # PUSH IMAGE
  ########################################

  - name: Push Docker Images
    if: github.ref == 'refs/heads/main'
    run: |
      IMAGE_TAG=${GITHUB_SHA::7}

      docker push $IMAGE_NAME:latest
      docker push $IMAGE_NAME:$IMAGE_TAG

  ########################################
  # EMAIL NOTIFICATION
  ########################################

  - name: Send Email Notification
    if: always()
    uses: dawidd6/action-send-mail@v3
    with:
      server_address: smtp.gmail.com
      server_port: 465
      secure: true
      username: ${{ secrets.EMAIL_USERNAME }}
      password: ${{ secrets.EMAIL_PASSWORD }}

      subject: "Node.js CI/CD Pipeline Status"

      body: |
        Status: ${{ job.status }}
        Repository: ${{ github.repository }}
        Branch: ${{ github.ref_name }}
        Commit: ${{ github.sha }}

      to: your-email@gmail.com
      from: GitHub Actions
```
