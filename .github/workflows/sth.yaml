name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: lokeshzenbook/node-app66

jobs:

  security-scan:
    name: Secrets, SAST & Dockerfile Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      #################################################
      # TRUFFLEHOG SECRET SCANNING
      #################################################

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: HEAD~1
          head: HEAD
          extra_args: --only-verified

      #################################################
      # SEMGREP SAST SCAN
      #################################################

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

      #################################################
      # HADOLINT DOCKERFILE SCAN
      #################################################

      - name: Hadolint Dockerfile Scan
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test --if-present

      - name: Run Unit Tests
        run: npm run test:unit --if-present

      - name: Generate Coverage
        run: npm run test:coverage --if-present

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  build-deploy:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    needs: unit-test

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build --if-present

      #################################################
      # INSTALL TRIVY
      #################################################

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sudo sh -s -- -b /usr/local/bin

      #################################################
      # FILESYSTEM SCAN
      #################################################

      - name: Trivy Filesystem Scan
        run: |
          trivy fs . \
          --severity HIGH,CRITICAL \
          --format table \
          --output trivy-fs-report.txt

      - name: Upload Trivy FS Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-report.txt

      #################################################
      # DOCKER LOGIN
      #################################################

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      #################################################
      # BUILD IMAGE
      #################################################

      - name: Build Docker Image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}

          docker build \
          -t $IMAGE_NAME:latest \
          -t $IMAGE_NAME:$IMAGE_TAG .

      #################################################
      # IMAGE SCAN
      #################################################

      - name: Trivy Image Scan
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}

          trivy image \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          --format table \
          $IMAGE_NAME:$IMAGE_TAG

      #################################################
      # PUSH IMAGE
      #################################################

      - name: Push Docker Images
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}

          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$IMAGE_TAG

      #################################################
      # EMAIL NOTIFICATION
      #################################################

      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: "Node.js CI/CD Pipeline Status"

          body: |
            Pipeline Status : ${{ job.status }}
            Repository      : ${{ github.repository }}
            Branch          : ${{ github.ref_name }}
            Commit          : ${{ github.sha }}
            Workflow        : ${{ github.workflow }}

          to: your-email@gmail.com
          from: GitHub Actions
