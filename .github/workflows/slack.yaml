name: Node.js CI/CD Pipeline

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: lokeshzenbook/node-app2

jobs:

  # =========================================================
  # Secrets Scan Stage
  # =========================================================
  secrets-scan:
    name: Secrets - Gitleaks Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =========================================================
  # Main CI/CD Pipeline
  # =========================================================
  ci-cd:
    name: Build Test Scan Push
    runs-on: ubuntu-latest
    needs: secrets-scan

    steps:

      # ---------- Checkout ----------
      - name: Checkout source
        uses: actions/checkout@v4

      # ---------- Node Setup ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # ---------- Install Dependencies ----------
      - name: Install dependencies
        run: npm install

      # ---------- Run Tests ----------
      - name: Run tests
        run: npm test

      # ---------- Build Application ----------
      - name: Build application
        run: npm run build

      # ---------- SonarCloud Scan ----------
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      # ---------- Install Trivy ----------
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -

          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | \
          sudo tee -a /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      # ---------- Trivy Scan ----------
      - name: Run Trivy FS Scan
        run: |
          trivy fs --severity HIGH,CRITICAL --no-progress . > trivy-report.txt

          CRITICAL=$(grep -i CRITICAL trivy-report.txt | wc -l)
          HIGH=$(grep -i HIGH trivy-report.txt | wc -l)

          echo "CRITICAL=$CRITICAL" >> $GITHUB_ENV
          echo "HIGH=$HIGH" >> $GITHUB_ENV

      # ---------- Upload Report ----------
      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

      # ---------- Docker Hub Login ----------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------- Build & Push Docker Image ----------
      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}

          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

          docker build -t $IMAGE_NAME:latest .
          docker build -t $IMAGE_NAME:$IMAGE_TAG .

          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$IMAGE_TAG

      # ---------- Email Notification ----------
      - name: Send Email Notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: "CI/CD Pipeline Status 🚀"

          body: |
            Pipeline Status: ${{ job.status }}

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}

            Docker Images:
            - $IMAGE_NAME:latest
            - $IMAGE_NAME:${{ env.IMAGE_TAG }}

            Trivy Summary:
            - Critical: ${{ env.CRITICAL }}
            - High: ${{ env.HIGH }}

            Run URL:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          to: your-email@gmail.com
          from: GitHub Actions
          attachments: trivy-report.txt

      # ---------- Slack Notification ----------
      - name: Send Slack Notification
        if: always()
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          STATUS="${{ job.status }}"
          COLOR="#36a64f"

          if [ "$STATUS" != "success" ]; then
            COLOR="#ff0000"
          fi

          curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"attachments\": [
              {
                \"color\": \"$COLOR\",
                \"blocks\": [
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"*🚀 CI/CD Pipeline Status: $STATUS*\"
                    }
                  },
                  {
                    \"type\": \"section\",
                    \"fields\": [
                      {
                        \"type\": \"mrkdwn\",
                        \"text\": \"*Repo:*\\n${{ github.repository }}\"
                      },
                      {
                        \"type\": \"mrkdwn\",
                        \"text\": \"*Branch:*\\n${{ github.ref_name }}\"
                      }
                    ]
                  },
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"*🐳 Docker Images:*\\n• $IMAGE_NAME:latest\\n• $IMAGE_NAME:${{ env.IMAGE_TAG }}\"
                    }
                  },
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"*🔐 Trivy Scan Summary:*\\n• Critical: ${{ env.CRITICAL }}\\n• High: ${{ env.HIGH }}\"
                    }
                  },
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"*🔗 <${RUN_URL}|View GitHub Run>*\"
                    }
                  }
                ]
              }
            ]
          }" \
          ${{ secrets.SLACK_WEBHOOK_URL }}