name: Build, Scan, Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: lokeshzenbook/node-nuxus

jobs:

  # ---------- Stage 1: Build & Test ----------
  build:
    name: "Stage 1: Build Application"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: .
          retention-days: 1
          if-no-files-found: warn

  # ---------- Stage 2: Security Scans ----------
  secret-scan:
    name: "Stage 2a: Gitleaks Secret Scan"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: "Stage 2b: Trivy Filesystem Scan"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-sarif
          path: trivy-fs.sarif
          retention-days: 7
          if-no-files-found: warn

  semgrep-scan:
    name: "Stage 2c: Semgrep SAST Scan"
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: python3 -m pip install --user semgrep

      - name: Run Semgrep SAST scan
        run: |
          export PATH="$PATH:$HOME/.local/bin"
          semgrep --version
          semgrep scan \
            --config auto \
            --sarif-output semgrep.sarif || true

      - name: Upload Semgrep SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 7
          if-no-files-found: warn

  codeql-scan:
    name: "Stage 2d: GitHub CodeQL Analysis"
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  eslint-scan:
    name: "Stage 2e: ESLint Code Scan"
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint scan
        run: |
          npx eslint . \
            --format json \
            --output-file eslint-report.json \
            --no-error-on-unmatched-pattern || true

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 7
          if-no-files-found: warn

  hadolint-scan:
    name: "Stage 2f: Hadolint Dockerfile Lint"
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-report.sarif
          no-fail: true

      - name: Upload Hadolint SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hadolint-report
          path: hadolint-report.sarif
          retention-days: 7
          if-no-files-found: warn

  # ---------- Stage 3: Docker Build & Image Scan ----------
  docker-build-scan:
    name: "Stage 3: Build & Scan Docker Image"
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - dependency-scan
      - semgrep-scan
      - codeql-scan
      - eslint-scan
      - hadolint-scan

    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "image-tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }} \
            -t ${{ env.IMAGE_NAME }}:latest .

      - name: Run Trivy Docker image scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-image.sarif

      - name: Upload Trivy image SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          retention-days: 7
          if-no-files-found: warn

      - name: Save Docker image as tarball
        run: |
          docker save \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }} \
            ${{ env.IMAGE_NAME }}:latest \
            -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ---------- Stage 4: Push to Docker Hub ----------
  push:
    name: "Stage 4: Push to Docker Hub"
    runs-on: ubuntu-latest
    needs: docker-build-scan
    if: github.event_name != 'pull_request'

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ needs.docker-build-scan.outputs.image-tag }}
          docker push ${{ env.IMAGE_NAME }}:latest

  # ---------- Stage 5: Security Report + Notifications ----------
  notify:
    name: "Stage 5: Security Report & Notification"
    runs-on: ubuntu-latest
    needs:
      - build
      - secret-scan
      - dependency-scan
      - semgrep-scan
      - codeql-scan
      - eslint-scan
      - hadolint-scan
      - docker-build-scan
      - push
    if: always()

    steps:
      - name: Determine pipeline status
        id: status
        shell: bash
        run: |
          if echo "${{ join(needs.*.result, ',') }}" | grep -q "failure"; then
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            echo "status_icon=❌" >> "$GITHUB_OUTPUT"
          else
            echo "status=SUCCESS" >> "$GITHUB_OUTPUT"
            echo "status_icon=✅" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all pipeline artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      # Generate a PDF from every SARIF file.
      # The Python code uses fpdf2's CHAR wrapping so long URLs,
      # hashes, paths and other unbroken strings cannot trigger:
      # "Not enough horizontal space to render a single character".
      - name: Generate SARIF security PDF
        if: always()
        shell: bash
        run: |
          python3 -m pip install --upgrade fpdf2

          mkdir -p artifacts/security-report

          cat > sarif_to_pdf.py <<'PY'
          import json
          import os
          from pathlib import Path
          from fpdf import FPDF

          SARIF_FILES = list(Path("artifacts").rglob("*.sarif"))
          OUTPUT = "artifacts/security-report/security-report.pdf"

          class SecurityReport(FPDF):
              def __init__(self):
                  super().__init__(orientation="L", unit="mm", format="A4")
                  self.set_auto_page_break(auto=True, margin=12)

                  font_candidates = [
                      "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
                      "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  ]

                  regular = font_candidates[0]
                  bold = font_candidates[1]

                  if Path(regular).exists() and Path(bold).exists():
                      self.add_font("DejaVu", "", regular)
                      self.add_font("DejaVu", "B", bold)
                      self.font_name = "DejaVu"
                  else:
                      self.font_name = "Helvetica"

              def safe(self, value):
                  if value is None:
                      return ""
                  return str(value).replace("\x00", " ")

              def wrapped(self, text, width=0, height=5):
                  # CHAR is critical for long unbroken strings such as:
                  # URLs, SHA values, registry paths and package names.
                  self.multi_cell(
                      width,
                      height,
                      self.safe(text),
                      wrapmode="CHAR",
                  )

          pdf = SecurityReport()

          # Avoid failing on an empty SARIF collection.
          total = 0
          findings = []

          for sarif_file in SARIF_FILES:
              try:
                  with open(sarif_file, "r", encoding="utf-8") as fh:
                      data = json.load(fh)
              except Exception as exc:
                  findings.append({
                      "tool": "SARIF parser",
                      "rule": "PARSE_ERROR",
                      "level": "error",
                      "file": str(sarif_file),
                      "line": "",
                      "message": f"Could not parse SARIF: {exc}",
                  })
                  continue

              for run in data.get("runs", []):
                  tool = (
                      run.get("tool", {})
                      .get("driver", {})
                      .get("name", "Unknown")
                  )

                  for result in run.get("results", []):
                      physical = (
                          result.get("locations", [{}])[0]
                          .get("physicalLocation", {})
                      )

                      location = physical.get("artifactLocation", {})
                      region = physical.get("region", {})

                      findings.append({
                          "tool": tool,
                          "rule": result.get("ruleId", "N/A"),
                          "level": result.get("level", "N/A"),
                          "file": location.get("uri", ""),
                          "line": region.get("startLine", ""),
                          "message": (
                              result.get("message", {})
                              .get("text", "")
                          ),
                      })
                      total += 1

          pdf.add_page()
          pdf.set_font(pdf.font_name, "B", 18)
          pdf.wrapped("DevSecOps Security Scan Report", height=8)

          pdf.set_font(pdf.font_name, "", 10)
          pdf.wrapped(
              f"Repository: {os.environ.get('GITHUB_REPOSITORY', '')}",
              height=5,
          )
          pdf.wrapped(
              f"Commit: {os.environ.get('GITHUB_SHA', '')}",
              height=5,
          )
          pdf.wrapped(f"Total findings: {total}", height=5)
          pdf.ln(4)

          if not findings:
              pdf.set_font(pdf.font_name, "B", 12)
              pdf.wrapped("No SARIF findings were available.", height=6)
          else:
              for index, finding in enumerate(findings, start=1):
                  pdf.set_font(pdf.font_name, "B", 11)
                  pdf.wrapped(
                      f"{index}. {finding['tool']} - {finding['rule']}",
                      height=6,
                  )

                  pdf.set_font(pdf.font_name, "", 9)
                  pdf.wrapped(
                      f"Severity: {finding['level']}",
                      height=5,
                  )
                  pdf.wrapped(
                      f"Location: {finding['file']}:{finding['line']}",
                      height=5,
                  )
                  pdf.wrapped(
                      f"Finding: {finding['message']}",
                      height=5,
                  )
                  pdf.ln(3)

          pdf.output(OUTPUT)
          print(f"Created {OUTPUT}")

          PY

          python3 sarif_to_pdf.py

      - name: Upload security PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report-pdf
          path: artifacts/security-report/security-report.pdf
          retention-days: 7
          if-no-files-found: warn

      - name: Generate pipeline report
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/notification

          cat > artifacts/notification/pipeline-report.txt <<EOF
          Pipeline : ${{ github.workflow }}
          Status   : ${{ steps.status.outputs.status }}
          Repo     : ${{ github.repository }} (${{ github.ref_name }})
          Trigger  : ${{ github.actor }} (${{ github.event_name }})
          Commit   : ${{ github.sha }}
          Run      : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
          EOF

      - name: Send Slack notification
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
        with:
          payload: |
            {
              "attachments": [
                {
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "${{ steps.status.outputs.status_icon }} *${{ steps.status.outputs.status }}*: `${{ github.workflow }}`\n*Repo:* `${{ github.repository }}`\n*Branch:* `${{ github.ref_name }}`\n*Commit:* `${{ github.sha }}`\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Security artifacts:* SARIF reports + consolidated PDF\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts|Download artifacts>"
                      }
                    }
                  ]
                }
              ]
            }

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ steps.status.outputs.status_icon }} ${{ steps.status.outputs.status }} - ${{ github.workflow }} (${{ github.repository }})"
          to: ${{ secrets.MAIL_TO }}
          from: "GitHub Actions <${{ secrets.EMAIL_USERNAME }}>"
          attach: >-
            artifacts/semgrep-sarif/semgrep.sarif,
            artifacts/eslint-report/eslint-report.json,
            artifacts/hadolint-report/hadolint-report.sarif,
            artifacts/trivy-fs-sarif/trivy-fs.sarif,
            artifacts/trivy-image-sarif/trivy-image.sarif,
            artifacts/security-report/security-report.pdf,
            artifacts/notification/pipeline-report.txt
          html_body: |
            <h3>${{ steps.status.outputs.status_icon }} ${{ steps.status.outputs.status }}: ${{ github.workflow }}</h3>
            <p><b>Repository:</b> ${{ github.repository }}</p>
            <p><b>Branch:</b> ${{ github.ref_name }}</p>
            <p><b>Triggered by:</b> ${{ github.actor }} (${{ github.event_name }})</p>
            <p><b>Commit:</b>
              <a href="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}">
                ${{ github.sha }}
              </a>
            </p>
            <p><b>Run logs:</b>
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                View run
              </a>
            </p>
            <p>The email includes the SARIF scan results and the consolidated PDF security report.</p>
