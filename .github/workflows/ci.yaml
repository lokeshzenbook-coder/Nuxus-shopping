name: Build, Scan & Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: lokeshzenbook/node-nuxus

jobs:

  # ---------- Stage 1: Build & Test ----------
  build:
    name: "Stage 1: Build Application"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: .
          retention-days: 1

  # ---------- Stage 2: Security Scans (parallel) ----------
  secret-scan:
    name: "Stage 2a: Gitleaks Secret Scan"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: "Stage 2b: Trivy Filesystem Scan"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  semgrep-scan:
    name: "Stage 2c: Semgrep SAST Scan"
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Semgrep SAST scan
        run: |
          python3 -m pip install --user semgrep
          export PATH="$PATH:$HOME/.local/bin"
          semgrep --version
          semgrep scan --config auto --sarif-output semgrep.sarif || true

      - name: Upload Semgrep SARIF results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 7

  codeql-scan:
    name: "Stage 2d: GitHub CodeQL Analysis"
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  eslint-scan:
    name: "Stage 2e: ESLint Code Scan"
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install ESLint tooling
        run: npm install --no-save eslint @eslint/js globals typescript-eslint

      - name: Run ESLint scan
        run: |
          npx eslint . --format json --output-file eslint-report.json --no-error-on-unmatched-pattern || true

      - name: Upload ESLint report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 7

  hadolint-scan:
    name: "Stage 2f: Hadolint Dockerfile Lint"
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-report.sarif
          no-fail: true

      - name: Upload Hadolint report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hadolint-report
          path: hadolint-report.sarif
          retention-days: 7

  # ---------- Stage 2g: Convert scan reports to PDF ----------
  generate-pdf-reports:
    name: "Stage 2g: Convert Reports to PDF"
    runs-on: ubuntu-latest
    needs: [semgrep-scan, eslint-scan, hadolint-scan]
    if: always()
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF generation library
        run: pip install --quiet fpdf2

      - name: Download Semgrep SARIF
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: semgrep-sarif
          path: semgrep-sarif

      - name: Download ESLint report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: eslint-report
          path: eslint-report

      - name: Download Hadolint report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hadolint-report
          path: hadolint-report

      - name: Convert reports to PDF
        run: |
          cat > convert_reports.py << 'PYEOF'
          import json, os
          from fpdf import FPDF

          def sarif_to_pdf(sarif_path, pdf_path, title):
              pdf = FPDF()
              pdf.set_auto_page_break(auto=True, margin=15)
              pdf.add_page()
              pdf.set_font("Helvetica", "B", 16)
              pdf.cell(0, 10, title, ln=True)
              pdf.set_font("Helvetica", "", 10)
              pdf.ln(4)

              if not os.path.exists(sarif_path):
                  pdf.multi_cell(0, 8, "No report file found for this scan.")
                  pdf.output(pdf_path)
                  return

              with open(sarif_path) as f:
                  data = json.load(f)

              count = 0
              for run in data.get("runs", []):
                  for result in run.get("results", []):
                      count += 1
                      rule = result.get("ruleId", "unknown-rule")
                      msg = result.get("message", {}).get("text", "")
                      level = result.get("level", "warning")
                      locations = result.get("locations", [])
                      loc_str = ""
                      if locations:
                          phys = locations[0].get("physicalLocation", {})
                          uri = phys.get("artifactLocation", {}).get("uri", "")
                          line = phys.get("region", {}).get("startLine", "")
                          loc_str = f"{uri}:{line}"
                      pdf.set_font("Helvetica", "B", 10)
                      pdf.multi_cell(0, 6, f"{count}. [{level.upper()}] {rule}")
                      pdf.set_font("Helvetica", "", 10)
                      pdf.multi_cell(0, 6, f"   Location: {loc_str}")
                      pdf.multi_cell(0, 6, f"   {msg}")
                      pdf.ln(2)

              if count == 0:
                  pdf.multi_cell(0, 8, "No findings reported.")

              pdf.output(pdf_path)

          def eslint_json_to_pdf(json_path, pdf_path, title):
              pdf = FPDF()
              pdf.set_auto_page_break(auto=True, margin=15)
              pdf.add_page()
              pdf.set_font("Helvetica", "B", 16)
              pdf.cell(0, 10, title, ln=True)
              pdf.set_font("Helvetica", "", 10)
              pdf.ln(4)

              if not os.path.exists(json_path):
                  pdf.multi_cell(0, 8, "No report file found for this scan.")
                  pdf.output(pdf_path)
                  return

              with open(json_path) as f:
                  data = json.load(f)

              count = 0
              for file_result in data:
                  file_path = file_result.get("filePath", "")
                  for msg in file_result.get("messages", []):
                      count += 1
                      severity = "ERROR" if msg.get("severity") == 2 else "WARNING"
                      rule = msg.get("ruleId", "unknown-rule")
                      line = msg.get("line", "")
                      text = msg.get("message", "")
                      pdf.set_font("Helvetica", "B", 10)
                      pdf.multi_cell(0, 6, f"{count}. [{severity}] {rule}")
                      pdf.set_font("Helvetica", "", 10)
                      pdf.multi_cell(0, 6, f"   {file_path}:{line}")
                      pdf.multi_cell(0, 6, f"   {text}")
                      pdf.ln(2)

              if count == 0:
                  pdf.multi_cell(0, 8, "No findings reported.")

              pdf.output(pdf_path)

          os.makedirs("pdf-reports", exist_ok=True)
          sarif_to_pdf("semgrep-sarif/semgrep.sarif", "pdf-reports/semgrep-report.pdf", "Semgrep SAST Findings")
          sarif_to_pdf("hadolint-report/hadolint-report.sarif", "pdf-reports/hadolint-report.pdf", "Hadolint Dockerfile Findings")
          eslint_json_to_pdf("eslint-report/eslint-report.json", "pdf-reports/eslint-report.pdf", "ESLint Findings")
          PYEOF
          python3 convert_reports.py

      - name: Upload PDF reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdf-reports
          path: pdf-reports/
          retention-days: 7

  # ---------- Stage 3: Docker Build & Image Scan ----------
  docker-build-scan:
    name: "Stage 3: Build & Scan Docker Image"
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-scan, semgrep-scan, codeql-scan, eslint-scan, hadolint-scan]
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "image-tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }} \
            -t ${{ env.IMAGE_NAME }}:latest .

      - name: Run Trivy Docker image scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # FIX: save BOTH tags into the tarball, not just the SHA tag
      - name: Save Docker image as tarball
        run: |
          docker save \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }} \
            ${{ env.IMAGE_NAME }}:latest \
            -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ---------- Stage 4: Push to Docker Hub ----------
  push:
    name: "Stage 4: Push to Docker Hub"
    runs-on: ubuntu-latest
    needs: docker-build-scan
    if: github.event_name != 'pull_request'
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ needs.docker-build-scan.outputs.image-tag }}
          docker push ${{ env.IMAGE_NAME }}:latest

  # ---------- Stage 5: Slack & Email Notification (PDF attachments) ----------
  notify:
    name: "Stage 5: Slack & Email Notification"
    runs-on: ubuntu-latest
    needs: [build, secret-scan, dependency-scan, semgrep-scan, codeql-scan, eslint-scan, hadolint-scan, generate-pdf-reports, docker-build-scan, push]
    if: always()
    steps:
      - name: Determine pipeline status
        id: status
        run: |
          if echo "${{ join(needs.*.result, ',') }}" | grep -q "failure"; then
            echo "status=❌ Failed" >> "$GITHUB_OUTPUT"
            echo "color=#dc3545" >> "$GITHUB_OUTPUT"
          else
            echo "status=✅ Success" >> "$GITHUB_OUTPUT"
            echo "color=#2eb886" >> "$GITHUB_OUTPUT"
          fi

      - name: Download PDF reports
        uses: actions/download-artifact@v4
        with:
          name: pdf-reports
          path: pdf-reports

      - name: Generate pipeline report
        run: |
          mkdir -p notification
          cat > notification/pipeline-report.txt <<EOF
          Pipeline : ${{ github.workflow }}
          Status   : ${{ steps.status.outputs.status }}
          Repo     : ${{ github.repository }} (${{ github.ref_name }})
          Trigger  : ${{ github.actor }} (${{ github.event_name }})
          Commit   : ${{ github.sha }}
          Artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
          EOF

      - name: Send Slack summary message
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*${{ steps.status.outputs.status }}*: `${{ github.workflow }}`\n*Repo:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Triggered by:* ${{ github.actor }} (${{ github.event_name }})\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*PDF scan reports are attached below (Semgrep, ESLint, Hadolint).*"
                      }
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      # Requires a Slack app with files:write scope (bot token), since
      # incoming webhooks cannot carry file attachments.
      - name: Upload PDF reports to Slack
        uses: MeilCli/slack-upload-file@v4
        with:
          slack_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channels: ${{ secrets.SLACK_CHANNEL_ID }}
          file_pattern: "pdf-reports/*.pdf"
          initial_comment: "Scan reports (PDF) for ${{ github.repository }}@${{ github.ref_name }} — ${{ steps.status.outputs.status }}"

      - name: Send email notification with PDF attachments
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ steps.status.outputs.status }} - ${{ github.workflow }} (${{ github.repository }})"
          to: ${{ secrets.MAIL_TO }}
          from: "GitHub Actions <${{ secrets.EMAIL_USERNAME }}>"
          attach: pdf-reports/semgrep-report.pdf,pdf-reports/eslint-report.pdf,pdf-reports/hadolint-report.pdf,notification/pipeline-report.txt
          html_body: |
            <h3>${{ steps.status.outputs.status }}: ${{ github.workflow }}</h3>
            <p><b>Repository:</b> ${{ github.repository }}</p>
            <p><b>Branch:</b> ${{ github.ref_name }}</p>
            <p><b>Triggered by:</b> ${{ github.actor }} (${{ github.event_name }})</p>
            <p><b>Commit:</b> <a href="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a></p>
            <p><b>Run logs:</b> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>
            <p><b>Attached:</b> Semgrep, ESLint and Hadolint findings as PDF reports.</p>
