name: Build, Scan & Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: lokeshzenbook/node-nuxus

jobs:

  # ---------- Stage 1: Build & Test ----------
  build:
    name: "Stage 1: Build Application"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: .
          retention-days: 1

  # ---------- Stage 2: Security Scans (parallel) ----------
  secret-scan:
    name: "Stage 2a: Gitleaks Secret Scan"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: "Stage 2b: Trivy Filesystem Scan"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  semgrep-scan:
    name: "Stage 2c: Semgrep SAST Scan"
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Semgrep SAST scan
        run: |
          python3 -m pip install --user semgrep
          export PATH="$PATH:$HOME/.local/bin"
          semgrep --version
          semgrep scan --config auto --sarif-output semgrep.sarif || true

      - name: Upload Semgrep SARIF results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 7

  codeql-scan:
    name: "Stage 2d: GitHub CodeQL Analysis"
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  eslint-scan:
    name: "Stage 2e: ESLint Code Scan"
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install ESLint tooling
        run: npm install --no-save eslint @eslint/js globals typescript-eslint

      - name: Run ESLint scan
        run: |
          npx eslint . --format json --output-file eslint-report.json --no-error-on-unmatched-pattern || true

      - name: Upload ESLint report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: eslint-report.json
          retention-days: 7

  hadolint-scan:
    name: "Stage 2f: Hadolint Dockerfile Lint"
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          format: sarif
          output-file: hadolint-report.sarif
          no-fail: true

      - name: Upload Hadolint report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hadolint-report
          path: hadolint-report.sarif
          retention-days: 7

  # ---------- Stage 2g: Convert SARIF reports to PDF ----------
  sarif-to-pdf:
    name: "Stage 2g: Convert SARIF Reports to PDF"
    runs-on: ubuntu-latest
    needs: [semgrep-scan, hadolint-scan]
    if: always()
    steps:
      - name: Download Semgrep SARIF
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: semgrep-sarif
          path: sarif-input

      - name: Download Hadolint SARIF
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: hadolint-report
          path: sarif-input

      - name: Install PDF conversion dependencies
        run: python3 -m pip install --user reportlab

      # FIX: the previous approach of piping raw SARIF (JSON) straight into a
      # PDF/mail attachment failed because SARIF is structured JSON, not
      # printable text. This renders each SARIF file into a proper,
      # human-readable PDF report before anything gets attached/emailed.
      - name: Convert SARIF files to PDF
        run: |
          export PATH="$PATH:$HOME/.local/bin"
          mkdir -p sarif-pdf
          cat > sarif_to_pdf.py <<'PYEOF'
          import json
          import os
          import sys
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.units import mm
          from reportlab.lib.styles import getSampleStyleSheet
          from reportlab.platypus import (
              SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle
          )
          from reportlab.lib import colors

          def load_sarif(path):
              with open(path, "r", encoding="utf-8") as f:
                  return json.load(f)

          def extract_rows(sarif):
              rows = [["Rule ID", "Severity", "Message", "Location"]]
              tool_name = "unknown"
              for run in sarif.get("runs", []):
                  tool_name = run.get("tool", {}).get("driver", {}).get("name", "unknown")
                  for result in run.get("results", []):
                      rule_id = result.get("ruleId", "N/A")
                      level = result.get("level", "note")
                      message = result.get("message", {}).get("text", "")
                      locations = result.get("locations", [])
                      loc_str = "N/A"
                      if locations:
                          phys = locations[0].get("physicalLocation", {})
                          uri = phys.get("artifactLocation", {}).get("uri", "N/A")
                          line = phys.get("region", {}).get("startLine", "")
                          loc_str = f"{uri}:{line}" if line else uri
                      rows.append([rule_id, level, message[:200], loc_str])
              return rows, tool_name

          def build_pdf(sarif_path, pdf_path):
              sarif = load_sarif(sarif_path)
              rows, tool_name = extract_rows(sarif)
              styles = getSampleStyleSheet()
              doc = SimpleDocTemplate(pdf_path, pagesize=A4,
                                       leftMargin=15 * mm, rightMargin=15 * mm,
                                       topMargin=15 * mm, bottomMargin=15 * mm)
              elements = [
                  Paragraph(f"Security Scan Report: {tool_name}", styles["Title"]),
                  Spacer(1, 8),
                  Paragraph(f"Source file: {os.path.basename(sarif_path)}", styles["Normal"]),
                  Paragraph(f"Total findings: {len(rows) - 1}", styles["Normal"]),
                  Spacer(1, 12),
              ]
              if len(rows) > 1:
                  wrapped = [rows[0]] + [
                      [Paragraph(str(c), styles["BodyText"]) for c in r] for r in rows[1:]
                  ]
                  table = Table(wrapped, colWidths=[70, 55, 260, 100])
                  table.setStyle(TableStyle([
                      ("BACKGROUND", (0, 0), (-1, 0), colors.HexColor("#2eb886")),
                      ("TEXTCOLOR", (0, 0), (-1, 0), colors.white),
                      ("FONTSIZE", (0, 0), (-1, -1), 8),
                      ("GRID", (0, 0), (-1, -1), 0.5, colors.grey),
                      ("VALIGN", (0, 0), (-1, -1), "TOP"),
                      ("ROWBACKGROUNDS", (0, 1), (-1, -1), [colors.white, colors.HexColor("#f4f4f4")]),
                  ]))
                  elements.append(table)
              else:
                  elements.append(Paragraph("No findings reported.", styles["Normal"]))
              doc.build(elements)

          if __name__ == "__main__":
              input_dir = sys.argv[1]
              output_dir = sys.argv[2]
              os.makedirs(output_dir, exist_ok=True)
              found = False
              for fname in os.listdir(input_dir):
                  if fname.endswith(".sarif"):
                      found = True
                      src = os.path.join(input_dir, fname)
                      out = os.path.join(output_dir, fname.replace(".sarif", ".pdf"))
                      try:
                          build_pdf(src, out)
                          print(f"Converted {src} -> {out}")
                      except Exception as exc:
                          print(f"WARNING: failed to convert {src}: {exc}")
              if not found:
                  print("No .sarif files found to convert.")
          PYEOF
          python3 sarif_to_pdf.py sarif-input sarif-pdf

      - name: Upload SARIF PDF reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarif-pdf-reports
          path: sarif-pdf/*.pdf
          retention-days: 7
          if-no-files-found: ignore

  # ---------- Stage 3: Docker Build, SBOM & Image Scan ----------
  docker-build-scan:
    name: "Stage 3: Build, SBOM & Scan Docker Image"
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-scan, semgrep-scan, codeql-scan, eslint-scan, hadolint-scan]
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: echo "image-tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }} \
            -t ${{ env.IMAGE_NAME }}:latest .

      - name: Generate SBOM (SPDX format via Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }}
          format: spdx-json
          output-file: sbom-${{ steps.meta.outputs.image-tag }}.spdx.json

      - name: Generate SBOM (CycloneDX format via Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }}
          format: cyclonedx-json
          output-file: sbom-${{ steps.meta.outputs.image-tag }}.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: |
            sbom-${{ steps.meta.outputs.image-tag }}.spdx.json
            sbom-${{ steps.meta.outputs.image-tag }}.cdx.json
          retention-days: 30

      - name: Run Trivy Docker image scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Both tags are saved into the tarball, not just the SHA tag
      - name: Save Docker image as tarball
        run: |
          docker save \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image-tag }} \
            ${{ env.IMAGE_NAME }}:latest \
            -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ---------- Stage 4: Push to Docker Hub ----------
  push:
    name: "Stage 4: Push to Docker Hub"
    runs-on: ubuntu-latest
    needs: docker-build-scan
    if: github.event_name != 'pull_request'
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ needs.docker-build-scan.outputs.image-tag }}
          docker push ${{ env.IMAGE_NAME }}:latest

  # ---------- Stage 5: Slack & Email Notification ----------
  notify:
    name: "Stage 5: Slack & Email Notification"
    runs-on: ubuntu-latest
    needs: [build, secret-scan, dependency-scan, semgrep-scan, codeql-scan, eslint-scan, hadolint-scan, sarif-to-pdf, docker-build-scan, push]
    if: always()
    steps:
      - name: Determine pipeline status
        id: status
        run: |
          if echo "${{ join(needs.*.result, ',') }}" | grep -q "failure"; then
            echo "status=❌ Failed" >> "$GITHUB_OUTPUT"
            echo "color=#dc3545" >> "$GITHUB_OUTPUT"
          else
            echo "status=✅ Success" >> "$GITHUB_OUTPUT"
            echo "color=#2eb886" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all pipeline artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Generate pipeline report
        run: |
          mkdir -p artifacts/notification
          cat > artifacts/notification/pipeline-report.txt <<EOF
          Pipeline : ${{ github.workflow }}
          Status   : ${{ steps.status.outputs.status }}
          Repo     : ${{ github.repository }} (${{ github.ref_name }})
          Trigger  : ${{ github.actor }} (${{ github.event_name }})
          Commit   : ${{ github.sha }}
          Artifacts: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
          EOF

      - name: Build email attachment list
        id: attachments
        run: |
          # Only attach files that actually exist for this run — the SARIF-PDF
          # and SBOM jobs can be skipped/empty on some triggers, and globbing
          # a missing path breaks the mail action, which was the root cause
          # of the earlier SARIF-to-PDF/email failure.
          files=""
          for pattern in \
            "artifacts/eslint-report/eslint-report.json" \
            "artifacts/notification/pipeline-report.txt" \
            "artifacts/sbom-reports/*.json" \
            "artifacts/sarif-pdf-reports/*.pdf" ; do
            for match in $pattern; do
              if [ -f "$match" ]; then
                files="$files,$match"
              fi
            done
          done
          files="${files#,}"
          echo "list=$files" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification with artifacts
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*${{ steps.status.outputs.status }}*: `${{ github.workflow }}`\n*Repo:* ${{ github.repository }}\n*Branch:* ${{ github.ref_name }}\n*Triggered by:* ${{ github.actor }} (${{ github.event_name }})\n*Commit:* <${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
                      }
                    },
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "*Artifacts:* SARIF PDF reports, eslint-report.json, sbom-reports (SPDX + CycloneDX), app-build, docker-image\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts|Download artifacts>"
                      }
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Send email notification with artifacts
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "${{ steps.status.outputs.status }} - ${{ github.workflow }} (${{ github.repository }})"
          to: ${{ secrets.MAIL_TO }}
          from: "GitHub Actions <${{ secrets.EMAIL_USERNAME }}>"
          attach: ${{ steps.attachments.outputs.list }}
          html_body: |
            <h3>${{ steps.status.outputs.status }}: ${{ github.workflow }}</h3>
            <p><b>Repository:</b> ${{ github.repository }}</p>
            <p><b>Branch:</b> ${{ github.ref_name }}</p>
            <p><b>Triggered by:</b> ${{ github.actor }} (${{ github.event_name }})</p>
            <p><b>Commit:</b> <a href="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}">${{ github.sha }}</a></p>
            <p><b>Run logs:</b> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View run</a></p>
            <p><b>Artifacts</b> (SARIF findings attached as readable PDFs, plus ESLint JSON, SBOM SPDX/CycloneDX and pipeline report; app-build &amp; docker-image are too large for email — download via link below):<br/>
            <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts">Download all artifacts</a></p>
